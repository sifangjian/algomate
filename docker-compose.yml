# Algomate Docker Compose 配置
# 用于生产环境一键部署

services:
  # 后端服务
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: algomate-backend
    restart: unless-stopped
    # 后端端口映射（本地开发调试时开启，可直接访问 API 文档）
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      # 挂载代码目录，修改代码后重启容器即可生效
      - .:/app
      # 数据库持久化：绑定挂载到宿主项目 data/ 目录，与本地 uv 启动路径一致
      # （容器内 /app/data/algomate.db <-> 宿主 ./data/algomate.db），
      # 便于数据备份与跨机器分发（直接拷贝 data/ 目录即可迁移）
      - ./data:/app/data
    environment:
      - TZ=Asia/Shanghai
      - APP_ENV=production
      - DATABASE_URL=sqlite:///app/data/algomate.db
    env_file:
      - .env

  # 前端服务（Vite 开发服务器）
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: algomate-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      # 挂载前端源代码，修改代码自动热更新
      - ./frontend:/app
      # 排除 node_modules，使用容器内的依赖
      - /app/node_modules
    depends_on:
      - backend
    environment:
      - TZ=Asia/Shanghai
      # 使用Docker服务名称（backend）作为主机名
      - VITE_API_URL=http://backend:8000

# Algomate Docker Compose 配置
# 单机部署：前后端各一个容器，数据(SQLite)挂载到宿主机 ./data 持久化。
# 外部访问经服务器自带反向代理(nginx/caddy)按路径分流：
#   www.fjsi.top/     -> frontend:3000
#   www.fjsi.top/api  -> backend:8000
# HTTPS / SSL 由外层反代处理，本 compose 不暴露 443。
#
# 代码更新：git pull 后在宿主机执行 `docker compose restart` 即可生效
# （源码以 volume 挂载进容器，无需重新 build；仅依赖变更才需 rebuild）。

services:
  # 后端服务
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: algomate-backend
    restart: unless-stopped
    # 仅映射给宿主机反向代理使用（不要直接暴露公网）
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      # 挂载代码目录：git pull 后 restart 即生效
      - .:/app
      # 数据库持久化：宿主 ./data <-> 容器 /app/data
      - ./data:/app/data
    environment:
      - TZ=Asia/Shanghai
      - APP_ENV=production
      # 显式指定数据库路径，避免默认 DATA_DIR 解析歧义
      - ALGOMATE_DB_PATH=/app/data/algomate.db
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/v1/progress/stats', timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # 前端服务（Vite 开发服务器，源码挂载，restart 生效）
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: algomate-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      # 挂载前端源代码：修改后自动热更新 / restart 生效
      - ./frontend:/app
      # 排除 node_modules，使用容器内的依赖
      - /app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - TZ=Asia/Shanghai
      # 前端走相对路径 /api，由外层反向代理分流到 backend，无需写死地址

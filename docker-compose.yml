# Algomate Docker Compose 配置
# 用于生产环境一键部署

services:
  # 后端服务
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    container_name: algomate-backend
    restart: unless-stopped
    # 后端端口映射（可选，仅开发调试时需要）
    # ports:
    #   - "${BACKEND_PORT:-8000}:8000"
    volumes:
      # 持久化数据库
      - algomate-data:/app/data
    environment:
      - APP_ENV=production
      - DATABASE_URL=sqlite:///app/data/algomate.db
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # 前端服务（Nginx 托管静态文件）
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      network: host
    container_name: algomate-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - VITE_API_URL=http://backend:8000

volumes:
  algomate-data:
    driver: local
# Algomate Docker Compose 配置
# 单机部署：前后端各一个容器。
#
# 访问架构（本部署采用）：
#   前端独立暴露端口（默认 8025，由 .env 的 FRONTEND_PORT 控制），
#     通过 www.fjsi.top:FRONTEND_PORT 直接访问，无需外层反代。
#   后端不对外暴露，仅在 compose 网络内被前端容器通过
#     http://backend:8000 访问（前端由 VITE_API_URL 注入该地址）。
#
# 代码更新：git pull 后在宿主机执行 `docker compose up -d` 即可生效
# （源码以 volume 挂载进容器，无需重新 build；仅依赖变更才需 rebuild）。
# 注意：修改了 .env 后必须 `up -d`（restart 不会重读环境变量）。

services:
  # 后端服务
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: algomate-backend
    restart: unless-stopped
    # 仅容器间通信使用；如需宿主机调试可保留映射，生产可注释掉下面两行
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      # 挂载代码目录：git pull 后 restart 即生效
      - .:/app
      # 数据库持久化：宿主 ./data <-> 容器 /app/data
      - ./data:/app/data
    environment:
      - TZ=Asia/Shanghai
      - APP_ENV=production
      # 显式指定数据库路径，避免默认 DATA_DIR 解析歧义
      - ALGOMATE_DB_PATH=/app/data/algomate.db
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/v1/progress/stats', timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # 前端服务（Vite 开发服务器，源码挂载，restart 生效）
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: algomate-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      # 挂载前端源代码：修改后自动热更新 / restart 生效
      - ./frontend:/app
      # 排除 node_modules，使用容器内的依赖
      - /app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - TZ=Asia/Shanghai
      # 容器内前端直连后端服务名 backend:8000（compose 网络 DNS 解析）
      - VITE_API_URL=http://backend:8000

# Algomate 反向代理配置示例（Nginx）
# 用途: 将 www.fjsi.top 的 / 转发到前端容器，/api 转发到后端容器
# 前置: Docker Compose 已启动，frontend:3000 / backend:8000 映射在宿主机
#       （本例假设由宿主机 nginx 反代到 127.0.0.1）
# SSL 由你的证书签发方式处理（certbot / 腾讯云托管证书），此处用占位路径
#
# 将本文件内容并入你的 nginx sites-enabled / conf.d，并 reload nginx。

server {
    listen 80;
    server_name www.fjsi.top;
    # 如有 certbot，此处会被自动改写为 443 + 重定向，保留 80 用于 ACME 校验
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name www.fjsi.top;

    # === 证书路径（按你的实际签发方式修改）===
    ssl_certificate     /etc/nginx/ssl/www.fjsi.top/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/www.fjsi.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 前端（Vite dev server，挂载源码）
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 后端 API
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    * { box-sizing: border-box; }
    body { width: 380px; font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; font-size: 13px; margin: 0; padding: 12px; color: #1f2328; }
    h1 { font-size: 14px; margin: 0 0 8px; display: flex; align-items: center; gap: 6px; }
    .pop-header { display: flex; align-items: center; justify-content: space-between; }
    .pop-toolbar { display: flex; gap: 4px; }
    .pop-toolbar button { border: 1px solid #d0d7de; background: #f6f8fa; border-radius: 5px; cursor: pointer; font-size: 12px; padding: 2px 7px; }
    .pop-toolbar button.pinned { background: #0969da; color: #fff; border-color: #0969da; }
    .field { margin-bottom: 8px; }
    .field label { font-weight: 600; display: block; margin-bottom: 3px; color: #57606a; }
    .val { background: #f6f8fa; border: 1px solid #d0d7de; border-radius: 6px; padding: 6px 8px; max-height: 90px; overflow: auto; white-space: pre-wrap; word-break: break-word; }
    input[type="text"], textarea, select { width: 100%; border: 1px solid #d0d7de; border-radius: 6px; padding: 6px 8px; font: inherit; }
    textarea { min-height: 60px; resize: vertical; }
    .tags span { display: inline-block; background: #ddf4ff; color: #0969da; border-radius: 10px; padding: 1px 8px; margin: 2px 3px 0 0; font-size: 12px; }
    .btn { width: 100%; border: none; border-radius: 6px; padding: 9px; font-size: 13px; font-weight: 600; cursor: pointer; }
    .btn-primary { background: #1f883d; color: #fff; }
    .btn-primary:hover { background: #1a7f37; }
    .btn-primary:disabled { background: #94d3a2; cursor: not-allowed; }
    .btn-add { background: #eaeef2; color: #1f2328; width: auto; padding: 5px 10px; font-size: 12px; margin-top: 4px; }
    .btn-add:hover { background: #d0d7de; }
    .btn-view { background: #0969da; color: #fff; text-decoration: none; text-align: center; }
    .btn-view:hover { background: #0860ca; }
    .btn-del { background: transparent; color: #cf222e; border: none; cursor: pointer; font-size: 14px; padding: 2px 6px; float: right; }
    .status { margin-top: 8px; font-size: 12px; min-height: 16px; }
    .status.ok { color: #1a7f37; }
    .status.err { color: #cf222e; }
    .status.warn { color: #9a6700; }
    .field-row { display: flex; gap: 8px; }
    .field-row .field { flex: 1; }
    .complexity-manual { margin-top: 4px; display: none; }
    .complexity-manual.show { display: block; }
    .conflict-box { border: 1px solid #d0d7de; border-radius: 6px; padding: 8px; margin-top: 8px; background: #fff; }
    .conflict-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 4px 0; }
    .conflict-row .btn-add { width: auto; margin: 0; }
    hr { border: none; border-top: 1px solid #d0d7de; margin: 10px 0; }
    .hint { color: #57606a; font-size: 11px; }
    .tech-item { border: 1px solid #d0d7de; border-radius: 6px; padding: 6px; margin-bottom: 6px; background: #fff; }
    .tech-item input { margin-bottom: 4px; }
    .dragging { opacity: 0.85; cursor: move; }
  </style>
</head>
<body>
  <div class="pop-header">
    <h1>📥 导入到 AlgoMate</h1>
    <div class="pop-toolbar">
      <button id="btn-pin" title="固定窗口（固定后点击外部不关闭）">📌 固定</button>
    </div>
  </div>

  <div class="field">
    <label>题目</label>
    <div class="val" id="f-title">（抓取中…）</div>
  </div>

  <div class="field">
    <label>难度</label>
    <div class="val" id="f-difficulty">—</div>
  </div>

  <div class="field">
    <label>标签（作为算法分类属性，不自动建技巧）</label>
    <div class="tags" id="f-tags"></div>
  </div>

  <div class="field">
    <label>代码（来自 LeetCode，可编辑）</label>
    <textarea id="f-code" class="val" style="max-height:120px;"></textarea>
    <div class="hint" id="f-lang"></div>
  </div>

  <div class="field">
    <label>突破口（做完题后最清晰，建议此刻填写）</label>
    <textarea id="f-breakthrough" placeholder="本解法的切入角度，如：哈希表存差值一遍扫描"></textarea>
  </div>

  <div class="field-row">
    <div class="field">
      <label>时间复杂度</label>
      <select id="f-time-select">
        <option value="">— 选择 —</option>
        <option value="O(1)">O(1)</option>
        <option value="O(log n)">O(log n)</option>
        <option value="O(n)">O(n)</option>
        <option value="O(n log n)">O(n log n)</option>
        <option value="O(n^2)">O(n^2)</option>
        <option value="O(2^n)">O(2^n)</option>
        <option value="__manual__">其他（手动填写）</option>
      </select>
      <input type="text" id="f-time" class="complexity-manual" placeholder="如：O(n + m)" />
    </div>
    <div class="field">
      <label>空间复杂度</label>
      <select id="f-space-select">
        <option value="">— 选择 —</option>
        <option value="O(1)">O(1)</option>
        <option value="O(log n)">O(log n)</option>
        <option value="O(n)">O(n)</option>
        <option value="O(n^2)">O(n^2)</option>
        <option value="__manual__">其他（手动填写）</option>
      </select>
      <input type="text" id="f-space" class="complexity-manual" placeholder="如：O(n)" />
    </div>
  </div>

  <div class="field">
    <label>易错点（每行一条）</label>
    <textarea id="f-pitfalls" placeholder="如：注意返回下标而非值&#10;注意 left&lt;right 边界"></textarea>
  </div>

  <hr />

  <div class="field">
    <label>破题思路</label>
    <textarea id="f-notes" placeholder="例如：双指针的核心是缩小搜索空间；注意 left/right 移动条件…"></textarea>
  </div>

  <div class="field">
    <label>技巧总结（可多条，每条生成一张技巧卡）</label>
    <div id="f-techniques"></div>
    <button type="button" class="btn btn-add" id="btn-add-tech">+ 添加一条技巧</button>
    <div class="hint">从本题提炼的可迁移经验，如「哈希表存差值一遍扫描」；可附标准代码模板</div>
  </div>

  <button class="btn btn-primary" id="btn-import" disabled>确认并导入到 AlgoMate</button>
  <div class="status" id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
